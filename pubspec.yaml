name: vtrc_mobile_app
description: "Vision Tracking Robot Car - Flutter Teleoperation & Live Vision App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6
  camera: ^0.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/map.png
    - assets/robot.jpg
    - assets/live_feed.jpg
